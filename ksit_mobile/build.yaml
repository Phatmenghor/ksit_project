targets:
  $default:
    builders:
      freezed:
        options:
          # Generate .freezed.dart files
          generate_copyWith: true
          generate_equal: true
          generate_toString: true
        generate_for:
          - lib/**/*.dart
      json_serializable:
        options:
          # JSON serialization options
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true
        generate_for:
          - lib/**/*.dart
