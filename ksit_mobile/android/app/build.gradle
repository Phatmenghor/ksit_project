plugins {
    id("com.android.application")
    // START: FlutterFire Configuration
    id("com.google.gms.google-services")
    // END: FlutterFire Configuration
    id("kotlin-android")
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id("dev.flutter.flutter-gradle-plugin")
}

// ADD KEYSTORE PROPERTIES HERE (after plugins block)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // IMPROVED: Change to a more professional package name
    namespace = "com.ksit.mobile"  // Changed from com.example.ksit_mobile
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.ksit.mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "String", "VERSION_NAME", "\"${flutter.versionName}\""
        buildConfigField "int", "VERSION_CODE", "${flutter.versionCode}"
    }

    flavorDimensions "environment"
    productFlavors {
        local {
            dimension "environment"
            applicationIdSuffix ".local"
            versionNameSuffix "-local"
            resValue "string", "app_name", "ims ksit[local]"
        }
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "ims ksit[dev]"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "ims ksit"
        }
    }

    // ADD THIS: Signing configurations
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // Debug configuration
            applicationIdSuffix ".debug"  // Allows debug and release versions side by side
            debuggable true
            minifyEnabled false
        }
        
        release {
            // IMPROVED: Better release configuration with proper signing
            signingConfig signingConfigs.release  // CHANGED: Use release signing instead of debug
            minifyEnabled true  // Enable code shrinking
            shrinkResources true  // Enable resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    // ADDED: Lint options for better code quality
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    
    // ADDED: Packaging options
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

flutter {
    source = "../.."
}